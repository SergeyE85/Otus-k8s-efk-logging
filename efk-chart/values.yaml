namespace: logging

elasticsearch:
  image: mirror.gcr.io/library/elasticsearch:9.5.3
  replicas: 1
  storage: 1Gi
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

kibana:
  image: mirror.gcr.io/library/kibana:9.5.3
  nodePort: 30001
  resources:
    requests:
      cpu: "500m"
      memory: "1280Mi"
    limits:
      cpu: "1500m"
      memory: "2560Mi"

  ingress:
    enabled: true
    className: nginx
    host: kibana.local
    path: /
    pathType: Prefix

fluentbit:
  image: fluent/fluent-bit:5.1.2
  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "200m"
      memory: "512Mi"